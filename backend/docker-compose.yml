services:
  postgres:
    image: postgres:15
    container_name: sih-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: sih_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: sih-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: sih-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql://postgres:mysecretpassword@postgres:5432/sih_db"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672//"
      REDIS_URL: "redis://redis:6379"
      AI_SERVER_URL: "http://10.0.0.51:8080/api/chat"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: always

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: sih-celery-worker
    environment:
      DOCKER_ENV: "true" 
      DATABASE_URL: "postgresql://postgres:mysecretpassword@postgres:5432/sih_db"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672//"
      HOST_PROJECT_PATH: "${PWD}" 
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./outputs:/app/outputs
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: always

  wappalyzer:
    build:
      context: .
      dockerfile: Dockerfile.wappalyzer
    image: local/wappalyzer
    container_name: sih-wappalyzer-builder
    entrypoint: ["echo", "Wappalyzer image built and ready."]
    restart: "no"

  gvm-tools:
    build:
      context: .
      dockerfile: Dockerfile.gvm-tools
    image: local/gvm-tools
    container_name: sih-gvm-tools-builder
    entrypoint: ["echo", "GVM Tools image built."]
    restart: "no"

  metasploit:
    image: metasploitframework/metasploit-framework
    container_name: sih-metasploit-cache
    entrypoint: ["echo", "Metasploit image pulled."]
    restart: "no"

volumes:
  postgres_data:
