services:
  postgres:
    image: postgres:15
    container_name: sih-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: sih_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: sih-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      # Set consumer timeout to 24 hours (default is 30 mins)
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit consumer_timeout 86400000
    restart: always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  # --- Redis for Caching ---
  redis:
    image: redis:7-alpine
    container_name: sih-redis
    ports:
      - "6379:6379"
    restart: always
    volumes:
      - redis_data:/data
  # -------------------------

  backend:
    build:
      context: ./backend  # <--- CHANGED: Point to backend dir
      dockerfile: Dockerfile.api
    container_name: sih-backend
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgresql://postgres:mysecretpassword@postgres:5432/sih_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672//
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - AI_SERVICE_URL=${AI_SERVICE_URL}
    volumes:
      - ./backend:/app
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  celery-worker:
    build:
      context: ./backend # <--- CHANGED
      dockerfile: Dockerfile.worker
    container_name: sih-celery-worker
    environment:
      DOCKER_ENV: "true" 
      DATABASE_URL: "postgresql://postgres:mysecretpassword@postgres:5432/sih_db"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672//"
      HOST_PROJECT_PATH: "${PWD}/backend" 
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend/outputs:/app/outputs
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    restart: always

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: sih-frontend
    expose:
      - "5173"
    volumes:
      - ./Frontend:/app
      - /app/node_modules
    restart: always
    depends_on:
      - backend

  wappalyzer:
    build:
      context: ./backend # <--- CHANGED
      dockerfile: Dockerfile.wappalyzer
    image: local/wappalyzer
    container_name: sih-wappalyzer-builder
    entrypoint: ["echo", "Wappalyzer image built and ready."]
    restart: "no"

  gvm-tools:
    build:
      context: ./backend # <--- CHANGED
      dockerfile: Dockerfile.gvm-tools
    image: local/gvm-tools
    container_name: sih-gvm-tools-builder
    entrypoint: ["echo", "GVM Tools image built."]
    restart: "no"

  metasploit:
    image: metasploitframework/metasploit-framework
    container_name: sih-metasploit-cache
    entrypoint: ["echo", "Metasploit image pulled."]
    restart: "no"

  qdrant:
    image: qdrant/qdrant:latest
    container_name: sih-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  nginx:
    image: nginx:latest
    container_name: sih-nginx
    ports:
      - "8080:80" # Expose Port 80 to the world via 8080 on the host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    restart: always
    depends_on:
      - frontend
      - backend

  whois:
    build:
      context: ./backend
      dockerfile: Dockerfile.whois
    image: local/whois
    container_name: sih-whois-builder
    entrypoint: ["echo", "Whois image built."]
    restart: "no"

  whatweb:
    build:
      context: ./backend
      dockerfile: Dockerfile.whatweb
    image: local/whatweb
    container_name: sih-whatweb-builder
    entrypoint: ["echo", "WhatWeb image built."]
    restart: "no"

  dirsearch:
    build:
      context: ./backend
      dockerfile: Dockerfile.dirsearch
    image: local/dirsearch
    container_name: sih-dirsearch-builder
    entrypoint: ["echo", "Dirsearch image built."]
    restart: "no"

  wfuzz:
    build:
      context: ./backend
      dockerfile: Dockerfile.wfuzz
    image: local/wfuzz
    container_name: sih-wfuzz-builder
    entrypoint: ["echo", "Wfuzz image built."]
    restart: "no"

  dalfox:
    build:
      context: ./backend
      dockerfile: Dockerfile.dalfox
    image: local/dalfox
    container_name: sih-dalfox-builder
    entrypoint: ["/app/dalfox", "version"]
    restart: "no"


volumes:
  postgres_data:
  redis_data:
  qdrant_data:
